[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "spritemcp"
version = "0.2.2"
description = "SpriteMCP — agent-driven pixel sprite toolkit with MCP tools for Cursor"
readme = "README.md"
license = { text = "MIT" }
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.0.0",
    # mcp 2.x renamed FastMCP → MCPServer; pin until SpriteMCP migrates.
    "mcp>=1.9.0,<2",
]
keywords = ["pixel-art", "sprites", "mcp", "animation", "game-art"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Topic :: Multimedia :: Graphics",
]

[project.scripts]
# Primary product: MCP server (uvx --from … spritemcp)
spritemcp = "spritemcp.mcp_server:main"

[project.urls]
Homepage = "https://github.com/NicoRMA/SpriteMCP"
Repository = "https://github.com/NicoRMA/SpriteMCP"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
spritemcp = [
    "authored_base/*.png",
    "pixel_editor/static/*",
]
