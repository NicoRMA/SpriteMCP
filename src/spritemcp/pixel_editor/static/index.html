<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SpriteMCP Pixel Editor</title>
  <link rel="stylesheet" href="/static/editor.css" />
</head>
<body>
  <header class="top">
    <div class="brand">
      <strong>SpriteMCP</strong>
      <span id="char-name" class="muted">…</span>
    </div>
    <div class="history" role="group" aria-label="History">
      <button type="button" id="btn-undo" class="tool" title="Undo (Ctrl+Z)" aria-label="Undo" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M12.5 8c-2.65 0-5.05 1-6.9 2.6L2 7v9h9l-3.62-3.62c1.39-1.16 3.16-1.88 5.12-1.88 3.54 0 6.55 2.31 7.6 5.5l2.37-.78C21.08 11.03 17.15 8 12.5 8z"/>
        </svg>
      </button>
      <button type="button" id="btn-redo" class="tool" title="Redo (Ctrl+Y)" aria-label="Redo" disabled>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M18.4 10.6C16.55 9 14.15 8 11.5 8c-4.65 0-8.58 3.03-9.96 7.22l2.36.78c1.05-3.19 4.05-5.5 7.6-5.5 1.95 0 3.73.72 5.12 1.88L13 16h9V7l-3.6 3.6z"/>
        </svg>
      </button>
    </div>
    <div class="tools" role="toolbar" aria-label="Tools">
      <button type="button" class="tool active" data-tool="pencil" title="Pencil (P)" aria-label="Pencil">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M3 17.25V21h3.75L17.81 9.94l-3.75-3.75L3 17.25zm2.92 2.92l-.06-.06L15.06 10.9l1.77 1.77-9.14 9.14-.06.06H5.92v-1.7zM20.71 7.04c.39-.39.39-1.02 0-1.41l-2.34-2.34a.996.996 0 0 0-1.41 0l-1.83 1.83 3.75 3.75 1.83-1.83z"/>
        </svg>
      </button>
      <button type="button" class="tool" data-tool="bucket" title="Paint bucket (G)" aria-label="Paint bucket">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M19.35 11.72 11.07 3.44a1.5 1.5 0 0 0-2.12 0L3.44 8.95a1.5 1.5 0 0 0 0 2.12l8.28 8.28a1.5 1.5 0 0 0 2.12 0l5.51-5.51a1.5 1.5 0 0 0 0-2.12zM12.12 17.7 5.3 10.88l4.71-4.71 6.82 6.82-4.71 4.71zM19 17c0 1.66-1 3-2.25 3S14.5 18.66 14.5 17c0-.83.75-2.1 1.88-3.5.2-.25.55-.25.74 0C18.25 14.9 19 16.17 19 17z"/>
        </svg>
      </button>
      <button type="button" class="tool" data-tool="eyedropper" title="Eyedropper (I)" aria-label="Eyedropper">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M20.71 5.63l-2.34-2.34a1 1 0 0 0-1.41 0l-3.12 3.12-1.23-1.21-1.42 1.42 1.21 1.23-7.1 7.1c-.4.4-.4 1.04 0 1.44l2.78 2.78c.4.4 1.04.4 1.44 0l7.1-7.1 1.23 1.21 1.42-1.42-1.21-1.23 3.12-3.12a1 1 0 0 0 0-1.41zM7.5 16.5L6 15l5.5-5.5 1.5 1.5L7.5 16.5z"/>
        </svg>
      </button>
      <button type="button" class="tool" data-tool="eraser" title="Eraser (E)" aria-label="Eraser">
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
          <path fill="currentColor" d="M16.24 3.56l4.2 4.2a2 2 0 0 1 0 2.83l-8.49 8.48H7.17L2.93 14.8a2 2 0 0 1 0-2.83l9.9-9.9a2 2 0 0 1 2.83 0zM5.34 13.4l3.54 3.54h2.12l5.66-5.66-5.66-5.66-5.66 5.66zm11.32 5.6H4v2h14.66c.55 0 1-.45 1-1s-.45-1-1-1z"/>
        </svg>
      </button>
    </div>
    <label class="brush-wrap" title="Brush size for pencil and eraser">
      Size
      <input type="number" id="brush-size" min="1" max="16" step="1" value="1" />
      <span class="muted">px</span>
    </label>
    <div class="color-wrap" title="Paint color (supports transparency)">
      <span class="color-label">Color</span>
      <button type="button" id="color-swatch" class="color-swatch" aria-label="Current color"></button>
      <input type="color" id="color" value="#c9a227" />
      <label class="check transparent-toggle" title="Use transparent paint">
        <input type="checkbox" id="color-transparent" />
        Transparent
      </label>
    </div>
    <label class="check">
      <input type="checkbox" id="show-underlay" checked />
      Body underlay
    </label>
    <label class="zoom-wrap">
      Zoom
      <input type="range" id="zoom" min="2" max="12" value="6" />
      <span id="zoom-label">6×</span>
    </label>
    <button type="button" id="btn-apply" class="primary">Apply</button>
    <span id="status" class="status" aria-live="polite"></span>
  </header>

  <main class="layout">
    <aside class="layers-panel">
      <h2>Layers</h2>
      <ul id="layer-list"></ul>
      <p class="hint">Eye toggles visibility. Only the selected layer is edited. Base is never rewritten.</p>
    </aside>
    <section class="canvas-wrap">
      <canvas id="view" width="540" height="768"></canvas>
    </section>
  </main>

  <script src="/static/editor.js"></script>
</body>
</html>
